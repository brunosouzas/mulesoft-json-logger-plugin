# The pipeline of this library (azure-devops-mulesoft-reusable-templates, templates/stages/mulesoft-library.yml).
# - A pull request into main: build and tests.
# - A merge into main: the Maven release, the tag vX.Y.Z and X.Y.Z on the org's Exchange.
# - Run pipeline on a tag (type vX.Y.Z in the branch/tag field): that version to the Exchange of a new trial org.
trigger:
  batch: false
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: app_templates
      type: github
      name: brunosouzas/azure-devops-mulesoft-reusable-templates
      endpoint: github.com_brunosouzas
      ref: refs/tags/v2.3.0

extends:
  template: templates/stages/mulesoft-library.yml@app_templates
